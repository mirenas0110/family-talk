<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Family & Study App</title>
  <style>
    :root {
      --bg-color: #f7f6f3;
      --surface-color: #ffffff;
      --border-color: #e2ded5;
      --border-dark: #d0cbc0;
      --text-main: #383634;
      --text-muted: #7c766e;
      --accent: #5a554e;
      --bubble-me: #eae5dc;
      --bubble-other: #ffffff;
      --dot-unread: #d9534f;
      --dot-online: #5cb85c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: var(--surface-color);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      position: relative;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-color);
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      background: var(--bg-color);
    }

    .content.active {
      display: flex;
    }

    /* ボトムナビゲーション */
    .nav-bar {
      height: 64px;
      border-top: 1px solid var(--border-color);
      display: flex;
      background: var(--surface-color);
      z-index: 10;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: color 0.15s;
      padding: 0 2px;
    }

    .nav-btn.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* ================= TALK MODULE ================= */
    .talk-header {
      background: var(--surface-color);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      background: var(--bg-color);
      color: var(--text-main);
      margin-bottom: 10px;
      outline: none;
    }

    .talk-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .talk-tab {
      padding: 5px 10px;
      font-size: 11px;
      border: 1px solid var(--border-dark);
      background: var(--surface-color);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .talk-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* 友達リスト（縦並び） */
    .friend-list-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .friend-item {
      background: var(--surface-color);
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .friend-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* アイコン ＆ オンライン/未読ポチ */
    .avatar-wrapper {
      position: relative;
      width: 36px;
      height: 36px;
      background: var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .online-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 10px;
      height: 10px;
      background: var(--dot-online);
      border: 2px solid var(--surface-color);
      border-radius: 50%;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      background: var(--dot-unread);
      border-radius: 50%;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }
    .msg-wrapper.me { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.other { align-self: flex-start; align-items: flex-start; }

    .msg-sender {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 3px;
      font-weight: 600;
    }

    .msg-bubble {
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.6;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      word-break: break-all;
    }
    .me .msg-bubble { background: var(--bubble-me); border-color: var(--border-dark); }
    .other .msg-bubble { background: var(--bubble-other); }

    .msg-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      gap: 6px;
    }

    .chat-input-area {
      padding: 12px 16px;
      background: var(--surface-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      background: var(--bg-color);
      outline: none;
    }

    .chat-send-btn {
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    /* ================= CALENDAR MODULE ================= */
    .cal-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-color);
      border-bottom: 1px solid var(--border-color);
    }

    .icon-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }

    .cal-day-name {
      background: var(--surface-color);
      text-align: center;
      font-size: 11px;
      padding: 8px 0;
      color: var(--text-muted);
      font-weight: 600;
    }

    .cal-cell {
      background: var(--surface-color);
      min-height: 75px;
      padding: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cal-date-num { font-size: 12px; font-weight: 600; }
    .cal-event-dot {
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 3px;
      background: var(--bubble-me);
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .day-detail-panel {
      padding: 16px;
      background: var(--surface-color);
      flex: 1;
      border-top: 1px solid var(--border-color);
      overflow-y: auto;
    }

    /* ================= STUDY LOG MODULE ================= */
    .study-container {
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
    }

    .timer-display {
      font-size: 52px;
      font-weight: 300;
      letter-spacing: 2px;
      margin: 10px 0;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }

    .timer-btn {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-dark);
    }

    .btn-start { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-reset { background: var(--surface-color); color: var(--text-main); }

    /* ================= BOARD MODULE ================= */
    .board-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .board-card {
      background: var(--surface-color);
      padding: 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ================= MY PAGE MODULE ================= */
    .mypage-container {
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .profile-card {
      background: var(--surface-color);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .profile-card input {
      text-align: center;
      font-size: 14px;
    }

    .setting-group {
      background: var(--surface-color);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
      text-align: left;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }

    .menu-item {
      padding: 14px 16px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .menu-item:hover { background: #faf9f6; }

    /* モーダル */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }

    .modal-content {
      background: var(--surface-color);
      width: 100%;
      max-width: 320px;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- TALK MODULE -->
    <div id="tab-talk" class="content active">
      <div class="talk-header">
        <input type="text" id="global-search" class="search-box" placeholder="メッセージや友達を検索..." oninput="filterTalkContent()">
        <div class="talk-tabs">
          <button class="talk-tab active" onclick="switchTalkSubTab('all', this)">全体</button>
          <button class="talk-tab" onclick="switchTalkSubTab('unapproved', this)">未承認</button>
          <button class="talk-tab" onclick="switchTalkSubTab('friends', this)">友達</button>
          <button class="talk-tab" onclick="switchTalkSubTab('groups', this)">グループ</button>
          <button class="talk-tab" onclick="switchTalkSubTab('add', this)">＋ 友達追加</button>
        </div>
      </div>
      
      <!-- メインのチャット・リスト表示領域 -->
      <div id="talk-body-area" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area" id="chat-input-area">
          <input type="text" id="chat-input" class="chat-input" placeholder="メッセージを入力..." onkeypress="handleKey(event)">
          <button class="chat-send-btn" onclick="sendMessage()">送信</button>
        </div>
      </div>
    </div>

    <!-- CALENDAR MODULE -->
    <div id="tab-calendar" class="content">
      <div class="cal-header">
        <div class="cal-title" id="cal-month-title" style="font-weight:600; font-size:14px;">2026年 10月</div>
        <button class="icon-btn" onclick="openEventModal()">＋</button>
      </div>
      <div class="cal-grid" id="cal-grid">
        <div class="cal-day-name">日</div><div class="cal-day-name">月</div><div class="cal-day-name">火</div>
        <div class="cal-day-name">水</div><div class="cal-day-name">木</div><div class="cal-day-name">金</div><div class="cal-day-name">土</div>
      </div>
      <div class="day-detail-panel" id="day-detail-panel">
        <h3 id="selected-date-title" style="font-size: 14px; margin-bottom: 8px; font-weight: 600;">日付を選択してください</h3>
        <div id="selected-date-events" style="font-size: 13px; color: var(--text-muted);">予定はありません</div>
      </div>
    </div>

    <!-- STUDY LOG MODULE -->
    <div id="tab-study" class="content">
      <div class="header"><h1>STUDY LOG</h1></div>
      <div class="study-container">
        <div style="font-size: 14px; color: var(--text-muted);">集中タイマー</div>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button class="timer-btn btn-start" id="timer-toggle-btn" onclick="toggleTimer()">スタート</button>
          <button class="timer-btn btn-reset" onclick="resetTimer()">リセット</button>
        </div>
      </div>
    </div>

    <!-- BOARD MODULE -->
    <div id="tab-board" class="content">
      <div class="header"><h1>BOARD</h1></div>
      <div class="board-container">
        <div class="board-card">
          <div style="font-weight:600; margin-bottom:4px;">📌 家族のルールメモ</div>
          <div style="color:var(--text-muted); font-size:13px;">ゴミ出しの曜日や大切なお知らせをいつでも残せます。</div>
        </div>
      </div>
    </div>

    <!-- MY PAGE MODULE -->
    <div id="tab-mypage" class="content">
      <div class="header"><h1>MY PAGE</h1></div>
      <div class="mypage-container">
        <div class="profile-card">
          <div style="font-size: 11px; color: var(--text-muted);">マイID: <span id="my-id-display">fam123</span></div>
          <div style="font-size: 12px; color: var(--text-muted);">ニックネーム</div>
          <input type="text" id="profile-name" value="パパ" class="chat-input" onchange="saveProfileSettings()">
          <div style="font-size: 12px; color: var(--text-muted);">設定用合言葉</div>
          <input type="text" id="profile-passphrase" value="family2026" class="chat-input" onchange="saveProfileSettings()">
        </div>

        <div class="setting-group">
          <div class="setting-row">
            <span>友達追加を許可しない</span>
            <input type="checkbox" id="setting-block-add" onchange="saveProfileSettings()">
          </div>
          <div class="setting-row">
            <span>オンライン状態を表示する</span>
            <input type="checkbox" id="setting-show-online" checked onchange="saveProfileSettings()">
          </div>
        </div>
        
        <div class="menu-list">
          <div class="menu-item" onclick="openGameModal('fortune')"><span>今日の運勢を占う</span><span>›</span></div>
          <div class="menu-item" onclick="openGameModal('brain')"><span>脳トレ・ミニパズル</span><span>›</span></div>
        </div>
      </div>
    </div>

    <!-- ボトムナビゲーション -->
    <nav class="nav-bar">
      <button class="nav-btn active" onclick="switchTab('talk', this)">TALK</button>
      <button class="nav-btn" onclick="switchTab('calendar', this)">CALENDAR</button>
      <button class="nav-btn" onclick="switchTab('study', this)">STUDY</button>
      <button class="nav-btn" onclick="switchTab('board', this)">BOARD</button>
      <button class="nav-btn" onclick="switchTab('mypage', this)">MY PAGE</button>
    </nav>
  </div>

  <!-- ミニゲームモーダル -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <h3 id="game-title" style="font-size: 15px;">ミニゲーム</h3>
      <div id="game-body" style="font-size: 14px; color: var(--text-muted);">内容</div>
      <button class="timer-btn btn-start" onclick="closeGameModal()">閉じる</button>
    </div>
  </div>

  <script>
    /* ---------------- データ初期化 & 永続化 ---------------- */
    let currentTalkSubTab = 'all';
    
    let messages = JSON.parse(localStorage.getItem('family_messages')) || [
      { id: 1, sender: 'ママ', text: '今日の夕方、買い物お願いできる？', time: '12:10', read: false },
      { id: 2, sender: '自分', text: '了解！何買う？', time: '12:15', read: true }
    ];

    let friends = JSON.parse(localStorage.getItem('family_friends')) || [
      { id: 'mom01', name: 'ママ', online: true, unread: true },
      { id: 'taro02', name: 'たろう', online: false, unread: false }
    ];

    let pendingRequests = JSON.parse(localStorage.getItem('family_pending')) || [
      { id: 'hanako', name: 'はなこ', passphrase: 'secret' }
    ];

    let mySettings = JSON.parse(localStorage.getItem('family_my_settings')) || {
      name: 'パパ',
      myId: 'papa999',
      passphrase: 'family2026',
      blockAdd: false,
      showOnline: true
    };

    let events = JSON.parse(localStorage.getItem('family_events')) || [
      { date: '2026-10-15', title: '家族会議', visibility: 'group' }
    ];

    let timerInterval = null;
    let timeLeft = 25 * 60;
    let isTimerRunning = false;

    // 初期読み込み時のマイページフォーム反映
    document.getElementById('profile-name').value = mySettings.name;
    document.getElementById('my-id-display').innerText = mySettings.myId;
    document.getElementById('profile-passphrase').value = mySettings.passphrase;
    document.getElementById('setting-block-add').checked = mySettings.blockAdd;
    document.getElementById('setting-show-online').checked = mySettings.showOnline;

    function saveProfileSettings() {
      mySettings.name = document.getElementById('profile-name').value;
      mySettings.passphrase = document.getElementById('profile-passphrase').value;
      mySettings.blockAdd = document.getElementById('setting-block-add').checked;
      mySettings.showOnline = document.getElementById('setting-show-online').checked;
      localStorage.setItem('family_my_settings', JSON.stringify(mySettings));
    }

    /* ---------------- タブ切り替え ---------------- */
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabId).classList.add('active');
      btnElement.classList.add('active');

      if (tabId === 'calendar') renderCalendar();
    }

    function switchTalkSubTab(subTab, element) {
      document.querySelectorAll('.talk-tab').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      currentTalkSubTab = subTab;
      renderTalkContent();
    }

    /* ---------------- TALK & 友達管理 ---------------- */
    function renderTalkContent(filterText = '') {
      const area = document.getElementById('talk-body-area');
      
      if (currentTalkSubTab === 'add') {
        // 友達追加画面
        area.innerHTML = `
          <div style="padding: 24px; display:flex; flex-direction:column; gap:16px;">
            <div style="font-size:14px; font-weight:600;">友達をID検索して追加</div>
            <input type="text" id="search-id-input" class="search-box" placeholder="相手のIDを入力...">
            <input type="text" id="search-pass-input" class="search-box" placeholder="合言葉を入力...">
            <button class="timer-btn btn-start" onclick="sendFriendRequest()">承認リクエストを送る</button>
          </div>
        `;
        return;
      }

      // 通常のチャットエリア / 友達リストエリアの復元
      area.innerHTML = `
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area" id="chat-input-area">
          <input type="text" id="chat-input" class="chat-input" placeholder="メッセージを入力..." onkeypress="handleKey(event)">
          <button class="chat-send-btn" onclick="sendMessage()">送信</button>
        </div>
      `;

      if (currentTalkSubTab === 'friends') {
        // 縦並びの友達リスト
        const msgContainer = document.getElementById('chat-messages');
        document.getElementById('chat-input-area').style.display = 'none';
        msgContainer.innerHTML = '';

        if (friends.length === 0) {
          msgContainer.innerHTML = '<div style="color:var(--text-muted); font-size:13px; text-align:center; margin-top:20px;">友達はまだいません</div>';
          return;
        }

        friends.forEach(f => {
          const item = document.createElement('div');
          item.className = 'friend-item';
          item.innerHTML = `
            <div class="friend-info">
              <div class="avatar-wrapper">
                ${f.name.charAt(0)}
                ${f.online && mySettings.showOnline ? '<div class="online-dot"></div>' : ''}
              </div>
              <span style="font-size:14px; font-weight:500;">${f.name}</span>
            </div>
            ${f.unread ? '<div class="unread-dot"></div>' : ''}
          `;
          msgContainer.appendChild(item);
        });
        return;
      }

      if (currentTalkSubTab === 'unapproved') {
        // 未承認リクエスト一覧
        const msgContainer = document.getElementById('chat-messages');
        document.getElementById('chat-input-area').style.display = 'none';
        msgContainer.innerHTML = '';

        if (pendingRequests.length === 0) {
          msgContainer.innerHTML = '<div style="color:var(--text-muted); font-size:13px; text-align:center; margin-top:20px;">未承認のリクエストはありません</div>';
          return;
        }

        pendingRequests.forEach((req, idx) => {
          const item = document.createElement('div');
          item.className = 'friend-item';
          item.innerHTML = `
            <div style="font-size:14px;">${req.name} さんからのリクエスト</div>
            <button class="timer-btn btn-start" style="padding:6px 12px; font-size:11px;" onclick="approveFriend(${idx})">承認</button>
          `;
          msgContainer.appendChild(item);
        });
        return;
      }

      // 「全体」または「グループ」タブ：通常のチャット画面
      document.getElementById('chat-input-area').style.display = 'flex';
      renderMessages(filterText);
    }

    function renderMessages(filterText = '') {
      const container = document.getElementById('chat-messages');
      if (!container) return;
      container.innerHTML = '';
      
      messages.forEach(m => {
        if (filterText && !m.text.includes(filterText)) return;
        const isMe = m.sender === mySettings.name;
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isMe ? 'me' : 'other'}`;
        
        wrapper.innerHTML = `
          <div class="msg-sender">${m.sender}</div>
          <div class="msg-bubble">${m.text}</div>
          <div class="msg-meta">
            <span>${m.time}</span>
            ${isMe ? `<span>${m.read ? '既読' : ''}</span>` : ''}
          </div>
        `;
        container.appendChild(wrapper);
      });
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      
      messages.push({
        id: Date.now(),
        sender: mySettings.name,
        text: text,
        time: timeStr,
        read: true
      });
      localStorage.setItem('family_messages', JSON.stringify(messages));
      input.value = '';
      renderMessages();
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function filterTalkContent() {
      const query = document.getElementById('global-search').value;
      if (currentTalkSubTab === 'all' || currentTalkSubTab === 'groups') {
        renderMessages(query);
      }
    }

    function sendFriendRequest() {
      const targetId = document.getElementById('search-id-input').value.trim();
      const pass = document.getElementById('search-pass-input').value.trim();
      if (!targetId || !pass) {
        alert('IDと合言葉を入力してください');
        return;
      }
      alert('リクエストを送信しました（相手の承認待ちです）');
      document.getElementById('search-id-input').value = '';
      document.getElementById('search-pass-input').value = '';
    }

    function approveFriend(index) {
      const approved = pendingRequests.splice(index, 1)[0];
      friends.push({ id: approved.id, name: approved.name, online: true, unread: false });
      localStorage.setItem('family_pending', JSON.stringify(pendingRequests));
      localStorage.setItem('family_friends', JSON.stringify(friends));
      renderTalkContent();
      alert(`${approved.name} さんを友達に追加しました！`);
    }

    /* ---------------- CALENDAR ---------------- */
    function renderCalendar() {
      const grid = document.getElementById('cal-grid');
      while (grid.children.length > 7) grid.removeChild(grid.lastChild);

      for (let i = 1; i <= 31; i++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        const dateStr = `2026-10-${String(i).padStart(2, '0')}`;
        
        cell.innerHTML = `<div class="cal-date-num">${i}</div>`;
        events.filter(ev => ev.date === dateStr).forEach(ev => {
          const dot = document.createElement('div');
          dot.className = 'cal-event-dot';
          dot.innerText = ev.title;
          cell.appendChild(dot);
        });

        cell.onclick = () => {
          document.getElementById('selected-date-title').innerText = `${dateStr} の予定`;
          const matched = events.filter(ev => ev.date === dateStr);
          document.getElementById('selected-date-events').innerHTML = matched.length === 0 ? '予定はありません' : matched.map(e => `<div>・${e.title}</div>`).join('');
        };
        grid.appendChild(cell);
      }
    }

    function openEventModal() {
      const title = prompt('予定のタイトルを入力:');
      if (!title) return;
      events.push({ date: '2026-10-15', title: title, visibility: 'group' });
      localStorage.setItem('family_events', JSON.stringify(events));
      renderCalendar();
    }

    /* ---------------- STUDY TIMER ---------------- */
    function toggleTimer() {
      const btn = document.getElementById('timer-toggle-btn');
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        btn.innerText = 'スタート';
      } else {
        isTimerRunning = true;
        btn.innerText = '一時停止';
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            const min = Math.floor(timeLeft / 60);
            const sec = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
          } else {
            alert('セッション終了！');
            resetTimer();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      timeLeft = 25 * 60;
      document.getElementById('timer-display').innerText = '25:00';
      document.getElementById('timer-toggle-btn').innerText = 'スタート';
    }

    /* ---------------- MINI GAME ---------------- */
    function openGameModal(type) {
      document.getElementById('game-modal').style.display = 'flex';
      const title = document.getElementById('game-title');
      const body = document.getElementById('game-body');
      if (type === 'fortune') {
        title.innerText = '今日の運勢';
        body.innerHTML = '<div style="font-size:18px; font-weight:600; margin:10px 0;">大吉 - 心穏やかな一日</div>ラッキーカラー：グレージュ';
      } else {
        title.innerText = '脳トレ';
        body.innerHTML = '今日の暗記数字：[ 4 8 2 ]';
      }
    }

    function closeGameModal() {
      document.getElementById('game-modal').style.display = 'none';
    }

    // 初期描画
    renderTalkContent();
  </script>
</body>
</html>
