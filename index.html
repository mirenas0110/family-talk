<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Family & Study App</title>
  <style>
    :root {
      --bg-color: #f7f6f3;
      --surface-color: #ffffff;
      --border-color: #e2ded5;
      --border-dark: #d0cbc0;
      --text-main: #383634;
      --text-muted: #7c766e;
      --accent: #5a554e;
      --accent-hover: #47433c;
      --bubble-me: #eae5dc;
      --bubble-other: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: var(--surface-color);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      position: relative;
    }

    /* 共通ヘッダー */
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-color);
      z-index: 10;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    /* メインコンテンツエリア */
    .content {
      flex: 1;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      background: var(--bg-color);
    }

    .content.active {
      display: flex;
    }

    /* ボトムナビゲーション */
    .nav-bar {
      height: 64px;
      border-top: 1px solid var(--border-color);
      display: flex;
      background: var(--surface-color);
      z-index: 10;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: color 0.15s;
    }

    .nav-btn.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* ================= TALK MODULE ================= */
    .talk-header {
      background: var(--surface-color);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      background: var(--bg-color);
      color: var(--text-main);
      margin-bottom: 10px;
      outline: none;
    }

    .talk-tabs {
      display: flex;
      gap: 8px;
    }

    .talk-tab {
      padding: 6px 12px;
      font-size: 12px;
      border: 1px solid var(--border-dark);
      background: var(--surface-color);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .talk-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      position: relative;
      transition: transform 0.2s ease;
    }

    .msg-wrapper.me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-wrapper.other {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-sender {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 3px;
      font-weight: 600;
    }

    .msg-bubble {
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.6;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      position: relative;
      word-break: break-all;
    }

    .me .msg-bubble {
      background: var(--bubble-me);
      border-color: var(--border-dark);
    }

    .other .msg-bubble {
      background: var(--bubble-other);
    }

    .msg-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      gap: 6px;
    }

    .reply-preview-bar {
      padding: 8px 16px;
      background: #eeeae2;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      display: none;
      justify-content: space-between;
      align-items: center;
    }

    .chat-input-area {
      padding: 12px 16px;
      background: var(--surface-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      background: var(--bg-color);
      outline: none;
    }

    .chat-send-btn {
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    /* ================= CALENDAR MODULE ================= */
    .cal-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-color);
      border-bottom: 1px solid var(--border-color);
    }

    .cal-title {
      font-size: 15px;
      font-weight: 600;
    }

    .icon-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }

    .cal-day-name {
      background: var(--surface-color);
      text-align: center;
      font-size: 11px;
      padding: 8px 0;
      color: var(--text-muted);
      font-weight: 600;
    }

    .cal-cell {
      background: var(--surface-color);
      min-height: 75px;
      padding: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cal-cell:hover {
      background: #faf9f6;
    }

    .cal-date-num {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    .cal-event-dot {
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 3px;
      background: var(--bubble-me);
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .day-detail-panel {
      padding: 16px;
      background: var(--surface-color);
      flex: 1;
      border-top: 1px solid var(--border-color);
      overflow-y: auto;
    }

    /* ================= STUDY LOG MODULE ================= */
    .study-container {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .timer-display {
      font-size: 52px;
      font-weight: 300;
      letter-spacing: 2px;
      color: var(--text-main);
      margin: 10px 0;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }

    .timer-btn {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-dark);
    }

    .btn-start { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-reset { background: var(--surface-color); color: var(--text-main); }

    .lock-setting {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* 集中ロックオーバーレイ */
    #focus-lock-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(56, 54, 52, 0.85);
      z-index: 1000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    /* ================= MY PAGE MODULE ================= */
    .mypage-container {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .profile-card {
      background: var(--surface-color);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu-item {
      padding: 14px 16px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-main);
    }

    .menu-item:hover {
      background: #faf9f6;
    }

    /* ミニゲーム モーダル */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }

    .modal-content {
      background: var(--surface-color);
      width: 100%;
      max-width: 360px;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- TALK MODULE -->
    <div id="tab-talk" class="content active">
      <div class="talk-header">
        <input type="text" id="global-search" class="search-box" placeholder="メッセージやメンバーを検索..." oninput="filterMessages()">
        <div class="talk-tabs">
          <button class="talk-tab active" onclick="switchTalkTab('pending', this)">未承認</button>
          <button class="talk-tab" onclick="switchTalkTab('friends', this)">友達</button>
          <button class="talk-tab" onclick="switchTalkTab('groups', this)">グループ</button>
        </div>
      </div>
      
      <div class="chat-messages" id="chat-messages">
        <!-- 動的描画 -->
      </div>

      <div class="reply-preview-bar" id="reply-preview-bar">
        <span id="reply-text-preview" style="font-size:12px; color:var(--text-muted);"></span>
        <button onclick="cancelReply()" style="background:none; border:none; cursor:pointer; font-size:12px;">✕</button>
      </div>

      <div class="chat-input-area">
        <input type="text" id="chat-input" class="chat-input" placeholder="メッセージを入力..." onkeypress="handleKey(event)">
        <button class="chat-send-btn" onclick="sendMessage()">送信</button>
      </div>
    </div>

    <!-- CALENDAR MODULE -->
    <div id="tab-calendar" class="content">
      <div class="cal-header">
        <div class="cal-title" id="cal-month-title">2026年 10月</div>
        <button class="icon-btn" onclick="openEventModal()">＋</button>
      </div>
      <div class="cal-grid" id="cal-grid">
        <!-- 曜日ヘッダー -->
        <div class="cal-day-name">日</div>
        <div class="cal-day-name">月</div>
        <div class="cal-day-name">火</div>
        <div class="cal-day-name">水</div>
        <div class="cal-day-name">木</div>
        <div class="cal-day-name">金</div>
        <div class="cal-day-name">土</div>
        <!-- カレンダー日付セル（動的生成） -->
      </div>
      <div class="day-detail-panel" id="day-detail-panel">
        <h3 id="selected-date-title" style="font-size: 14px; margin-bottom: 10px; font-weight: 600;">日付を選択してください</h3>
        <div id="selected-date-events" style="font-size: 13px; color: var(--text-muted);">予定はありません</div>
      </div>
    </div>

    <!-- STUDY LOG MODULE -->
    <div id="tab-study" class="content">
      <div class="header">
        <h1>STUDY LOG</h1>
      </div>
      <div class="study-container">
        <div style="font-size: 14px; color: var(--text-muted);">フォーカス・タイマー</div>
        <div class="timer-display" id="timer-display">25:00</div>
        
        <div class="timer-controls">
          <button class="timer-btn btn-start" id="timer-toggle-btn" onclick="toggleTimer()">スタート</button>
          <button class="timer-btn btn-reset" onclick="resetTimer()">リセット</button>
        </div>

        <label class="lock-setting">
          <input type="checkbox" id="lock-mode-checkbox">
          <span>集中モード（タイマー中は他タブロック）</span>
        </label>
      </div>
    </div>

    <!-- MY PAGE MODULE -->
    <div id="tab-mypage" class="content">
      <div class="header">
        <h1>MY PAGE</h1>
      </div>
      <div class="mypage-container">
        <div class="profile-card">
          <div style="font-weight: 600; font-size: 15px;">ユーザー名</div>
          <input type="text" id="profile-name" value="パパ" style="margin-bottom:0;" onchange="saveProfile()">
        </div>
        
        <div class="menu-list">
          <div class="menu-item" onclick="openGameModal('fortune')">
            <span>今日の運勢を占う</span>
            <span>›</span>
          </div>
          <div class="menu-item" onclick="openGameModal('brain')">
            <span>脳トレ（数独・ミニパズル）</span>
            <span>›</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ボトムナビゲーション -->
    <nav class="nav-bar">
      <button class="nav-btn active" onclick="switchTab('talk', this)">TALK</button>
      <button class="nav-btn" onclick="switchTab('calendar', this)">CALENDAR</button>
      <button class="nav-btn" onclick="switchTab('study', this)">STUDY LOG</button>
      <button class="nav-btn" onclick="switchTab('mypage', this)">MY PAGE</button>
    </nav>

  </div>

  <!-- 集中ロック中画面 -->
  <div id="focus-lock-overlay">
    <h2>集中モード中</h2>
    <p style="font-size: 13px; margin-top: 10px; color: #d0cbc0;">タイマーが終了するまで他のタブは開けません。</p>
  </div>

  <!-- ミニゲームモーダル -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <h3 id="game-title" style="font-size: 15px;">ミニゲーム</h3>
      <div id="game-body" style="font-size: 14px; color: var(--text-muted);">ここに内容が入ります</div>
      <button class="timer-btn btn-start" onclick="closeGameModal()">閉じる</button>
    </div>
  </div>

  <script>
    /* ---------------- 状態管理・初期化 ---------------- */
    let currentTab = 'talk';
    let messages = JSON.parse(localStorage.getItem('family_messages')) || [
      { id: 1, sender: 'ママ', text: '今日の夕方、買い物お願いできる？', time: '12:10', read: true, type: 'group' },
      { id: 2, sender: '自分', text: '了解！何買う？', time: '12:15', read: true, type: 'group' }
    ];
    let events = JSON.parse(localStorage.getItem('family_events')) || [
      { date: '2026-10-15', title: '家族会議', visibility: 'group', tag: '家庭' },
      { date: '2026-10-20', title: '歯科検診', visibility: 'private', tag: '自分' }
    ];
    let replyingTo = null;
    let timerInterval = null;
    let timeLeft = 25 * 60;
    let isTimerRunning = false;

    // タブ切り替え
    function switchTab(tabId, btnElement) {
      if (isTimerRunning && document.getElementById('lock-mode-checkbox').checked && tabId !== 'study') {
        document.getElementById('focus-lock-overlay').style.display = 'flex';
        setTimeout(() => {
          document.getElementById('focus-lock-overlay').style.display = 'none';
        }, 2000);
        return;
      }

      currentTab = tabId;
      document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabId).classList.add('active');
      btnElement.classList.add('active');

      if (tabId === 'calendar') renderCalendar();
    }

    function switchTalkTab(subTab, element) {
      document.querySelectorAll('.talk-tab').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      renderMessages();
    }

    /* ---------------- TALK 機能 ---------------- */
    function renderMessages(filterText = '') {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      
      const filtered = messages.filter(m => m.text.includes(filterText) || m.sender.includes(filterText));

      filtered.forEach(m => {
        const isMe = m.sender === (localStorage.getItem('my_name') || 'パパ');
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isMe ? 'me' : 'other'}`;
        
        let replyHtml = m.replyTo ? `<div style="font-size:11px; color:var(--text-muted); border-left:2px solid var(--accent); padding-left:4px; margin-bottom:4px;">${m.replyTo}</div>` : '';

        wrapper.innerHTML = `
          <div class="msg-sender">${m.sender}</div>
          <div class="msg-bubble">
            ${replyHtml}
            ${m.text}
          </div>
          <div class="msg-meta">
            <span>${m.time}</span>
            ${isMe ? `<span>${m.read ? '既読' : ''}</span>` : ''}
          </div>
        `;
        container.appendChild(wrapper);
      });
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      
      const newMsg = {
        id: Date.now(),
        sender: localStorage.getItem('my_name') || 'パパ',
        text: text,
        time: timeStr,
        read: true,
        type: 'group',
        replyTo: replyingTo ? `返信先: ${replyingTo}` : null
      };

      messages.push(newMsg);
      localStorage.setItem('family_messages', JSON.stringify(messages));
      input.value = '';
      cancelReply();
      renderMessages();
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function filterMessages() {
      const query = document.getElementById('global-search').value;
      renderMessages(query);
    }

    function cancelReply() {
      replyingTo = null;
      document.getElementById('reply-preview-bar').style.display = 'none';
    }

    /* ---------------- CALENDAR 機能 ---------------- */
    function renderCalendar() {
      const grid = document.getElementById('cal-grid');
      // 曜日ヘッダー以降をクリア
      while (grid.children.length > 7) {
        grid.removeChild(grid.lastChild);
      }

      // 2026年10月のサンプル構築
      for (let i = 1; i <= 31; i++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        const dateStr = `2026-10-${String(i).padStart(2, '0')}`;
        
        cell.innerHTML = `<div class="cal-date-num">${i}</div>`;
        
        // 当日の予定を表示
        events.filter(ev => ev.date === dateStr).forEach(ev => {
          const dot = document.createElement('div');
          dot.className = 'cal-event-dot';
          dot.innerText = ev.title;
          cell.appendChild(dot);
        });

        cell.onclick = () => selectDate(dateStr);
        grid.appendChild(cell);
      }
    }

    function selectDate(dateStr) {
      document.getElementById('selected-date-title').innerText = `${dateStr} の予定`;
      const matched = events.filter(ev => ev.date === dateStr);
      const container = document.getElementById('selected-date-events');
      
      if (matched.length === 0) {
        container.innerHTML = '予定はありません';
      } else {
        container.innerHTML = matched.map(e => `<div>・${e.title} (${e.visibility === 'private' ? '自分用' : 'グループ'})</div>`).join('');
      }
    }

    function openEventModal() {
      const title = prompt('予定のタイトルを入力してください:');
      if (!title) return;
      const isPrivate = confirm('自分用（プライベート）にしますか？\n[OK] 自分用 / [キャンセル] グループ公開');
      
      events.push({
        date: '2026-10-15',
        title: title,
        visibility: isPrivate ? 'private' : 'group',
        tag: '一般'
      });
      localStorage.setItem('family_events', JSON.stringify(events));
      renderCalendar();
    }

    /* ---------------- STUDY LOG (タイマー) 機能 ---------------- */
    function toggleTimer() {
      const btn = document.getElementById('timer-toggle-btn');
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        btn.innerText = 'スタート';
        btn.classList.remove('btn-reset');
        btn.classList.add('btn-start');
      } else {
        isTimerRunning = true;
        btn.innerText = '一時停止';
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            alert('お疲れ様でした！集中セッション終了です。');
            resetTimer();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      timeLeft = 25 * 60;
      updateTimerDisplay();
      const btn = document.getElementById('timer-toggle-btn');
      btn.innerText = 'スタート';
    }

    function updateTimerDisplay() {
      const min = Math.floor(timeLeft / 60);
      const sec = timeLeft % 60;
      document.getElementById('timer-display').innerText = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    /* ---------------- MY PAGE & MINI GAME ---------------- */
    function saveProfile() {
      const name = document.getElementById('profile-name').value;
      localStorage.setItem('my_name', name);
    }

    function openGameModal(type) {
      const modal = document.getElementById('game-modal');
      const title = document.getElementById('game-title');
      const body = document.getElementById('game-body');
      
      modal.style.display = 'flex';
      if (type === 'fortune') {
        title.innerText = '今日の運勢';
        const fortunes = ['大吉 - 心穏やかに過ごせる一日', '中吉 - 小さなラッキーが見つかるかも', '小吉 - 丁寧な作業が吉を呼ぶ'];
        const randomFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
        body.innerHTML = `<div style="font-size:18px; font-weight:600; color:var(--text-main); margin:10px 0;">${randomFortune}</div>ラッキーカラー：グレージュ`;
      } else {
        title.innerText = '脳トレ・ミニパズル';
        body.innerHTML = '「今日の暗記チャレンジ：3桁の数字 [ 4 8 2 ] を覚えておこう！」';
      }
    }

    function closeGameModal() {
      document.getElementById('game-modal').style.display = 'none';
    }

    // 初期描画
    renderMessages();
  </script>
</body>
</html>
