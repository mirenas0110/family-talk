<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Family & Study App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar for desktop app feel */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-900 h-screen w-screen overflow-hidden flex items-center justify-center p-2 sm:p-6">

    <!-- PC Window Shell -->
    <div id="app-window" class="w-full max-w-6xl h-full max-h-[850px] bg-white rounded-xl shadow-2xl flex flex-col overflow-hidden border border-slate-700">
        
        <!-- Window Titlebar -->
        <div class="bg-slate-800 text-slate-300 px-4 py-2.5 flex items-center justify-between select-none shrink-0">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-rose-500 inline-block cursor-pointer" title="Close"></div>
                <div class="w-3 h-3 rounded-full bg-amber-500 inline-block cursor-pointer" title="Minimize"></div>
                <div class="w-3 h-3 rounded-full bg-emerald-500 inline-block cursor-pointer" title="Maximize"></div>
                <span class="text-xs font-medium ml-2 text-slate-400">Minimal Family & Study Desktop v2.4</span>
            </div>
            <div class="flex items-center space-x-3 text-xs text-slate-400">
                <span id="window-user-status">未ログイン</span>
                <i class="fa-solid fa-window-maximize hover:text-white cursor-pointer transition"></i>
            </div>
        </div>

        <!-- Main Workspace Container -->
        <div id="main-container" class="flex-1 flex overflow-hidden relative">
            <!-- Dynamic views injected here -->
        </div>
    </div>

    <!-- Message Box Modal (Custom Alert Replacement) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full shadow-2xl transform transition-all scale-100">
            <h3 id="modal-title" class="text-lg font-bold text-slate-800 mb-2">通知</h3>
            <p id="modal-message" class="text-sm text-slate-600 mb-6">メッセージ内容</p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Global Application State
        let currentUser = null;
        let stayLoggedIn = false;
        let currentTab = 'dashboard';
        
        // Mock Database of users and records
        let users = JSON.parse(localStorage.getItem('app_users')) || [
            { id: 'user_dad', name: 'パパ', role: '保護者' },
            { id: 'user_mom', name: 'ママ', role: '保護者' },
            { id: 'user_taro', name: '太郎', role: '生徒' }
        ];

        let focusRecords = JSON.parse(localStorage.getItem('app_focus')) || [
            { id: 1, user: '太郎', subject: '数学', time: 45, date: '2026-06-07' },
            { id: 2, user: '太郎', subject: '英語', time: 30, date: '2026-06-06' }
        ];

        let boardPosts = JSON.parse(localStorage.getItem('app_board')) || [
            { id: 1, user: 'パパ', tag: '連絡', text: '今週末の予定を確認しておいてね。', time: '10:00' },
            { id: 2, user: '太郎', tag: '質問', text: '数学の宿題のページ番号がわかりません。', time: '11:15' }
        ];

        let chatMessages = JSON.parse(localStorage.getItem('app_chats')) || {
            'パパ': [
                { sender: 'パパ', text: 'お疲れ様！今日の勉強はどうだった？', time: '12:00', type: 'text' },
                { sender: '太郎', text: 'がんばってるよ！', time: '12:05', type: 'text' }
            ],
            'ママ': [
                { sender: 'ママ', text: '夕方おやつ置いておくね。', time: '15:00', type: 'text' }
            ]
        };

        let customTags = JSON.parse(localStorage.getItem('app_tags')) || {
            calendar: ['テスト', '行事', '部活', 'その他'],
            focus: ['数学', '英語', '国語', '理科', '社会'],
            board: ['連絡', '質問', '相談', '雑談']
        };

        let activeChatUser = null;
        let typingTimeout = null;

        function showModal(title, message) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function saveData() {
            localStorage.setItem('app_users', JSON.stringify(users));
            localStorage.setItem('app_focus', JSON.stringify(focusRecords));
            localStorage.setItem('app_board', JSON.stringify(boardPosts));
            localStorage.setItem('app_chats', JSON.stringify(chatMessages));
            localStorage.setItem('app_tags', JSON.stringify(customTags));
        }

        function renderLoginView() {
            const container = document.getElementById('main-container');
            document.getElementById('window-user-status').innerText = '未ログイン';
            
            container.innerHTML = `
                <div class="flex-1 flex items-center justify-center bg-slate-50 p-6">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold shadow-inner">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-slate-800">Family & Study Hub</h1>
                            <p class="text-sm text-slate-500 mt-1">ログインIDを入力するか、新規登録してください</p>
                        </div>
                        
                        <div class="space-y-5">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">ログインID</label>
                                <input type="text" id="login-id-input" placeholder="例: user_taro" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-sm">
                            </div>

                            <div class="flex items-center justify-between text-sm">
                                <label class="flex items-center space-x-2 cursor-pointer select-none">
                                    <input type="checkbox" id="stay-logged-in" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                                    <span class="text-slate-600 font-medium">ログインしたままにする</span>
                                </label>
                            </div>

                            <div class="flex space-x-3 pt-2">
                                <button onclick="handleLogin()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition text-sm">
                                    ログイン
                                </button>
                                <button onclick="handleAutoRegisterAndLogin()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-emerald-200 transition text-sm flex items-center justify-center space-x-1.5" title="かぶりのない一意のIDを自動生成して新規登録＆ログイン">
                                    <i class="fa-solid fa-user-plus text-xs"></i>
                                    <span>新規登録</span>
                                </button>
                            </div>
                        </div>

                        <div class="mt-8 border-t border-slate-100 pt-4 text-center">
                            <p class="text-xs text-slate-400">既存ユーザー例: user_dad, user_mom, user_taro</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Generate unique ID that doesn't conflict with existing users
        function generateUniqueId() {
            let newId;
            let existingIds = users.map(u => u.id);
            do {
                const randomNum = Math.floor(1000 + Math.random() * 9000);
                newId = `user_${randomNum}`;
            } while (existingIds.includes(newId));
            return newId;
        }

        function handleAutoRegisterAndLogin() {
            const uniqueId = generateUniqueId();
            const defaultName = `新規ユーザー_${uniqueId.replace('user_', '')}`;
            
            // Create new account
            const newUser = { id: uniqueId, name: defaultName, role: '生徒' };
            users.push(newUser);
            saveData();

            // Set as current user & login
            currentUser = newUser;
            stayLoggedIn = document.getElementById('stay-logged-in') ? document.getElementById('stay-logged-in').checked : false;
            
            showModal('新規登録完了', `一意のID「${uniqueId}」でアカウントを作成し、ログインしました！`);
            setTimeout(() => {
                closeModal();
                renderAppLayout();
            }, 600);
        }

        function handleLogin() {
            const idInput = document.getElementById('login-id-input').value.trim();
            stayLoggedIn = document.getElementById('stay-logged-in').checked;

            if (!idInput) {
                showModal('エラー', 'ログインIDを入力してください。');
                return;
            }

            const found = users.find(u => u.id === idInput);
            if (found) {
                currentUser = found;
                renderAppLayout();
            } else {
                showModal('エラー', '該当するログインIDが見つかりません。新規登録ボタンをお試しください。');
            }
        }

        function renderAppLayout() {
            const container = document.getElementById('main-container');
            document.getElementById('window-user-status').innerText = `${currentUser.name} (${currentUser.role}) でログイン中`;

            container.innerHTML = `
                <!-- Sidebar Navigation -->
                <div class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0 select-none border-r border-slate-800">
                    <div>
                        <div class="p-5 border-b border-slate-800 flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold shadow">
                                ${currentUser.name.charAt(0)}
                            </div>
                            <div class="overflow-hidden">
                                <h4 class="text-sm font-bold text-white truncate">${currentUser.name}</h4>
                                <span class="text-xs text-indigo-400 font-medium">${currentUser.role}</span>
                            </div>
                        </div>

                        <nav class="p-4 space-y-1.5">
                            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition ${currentTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}">
                                <i class="fa-solid fa-chart-pie w-5"></i>
                                <span>ダッシュボード</span>
                            </button>
                            <button onclick="switchTab('calendar')" id="nav-calendar" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition ${currentTab === 'calendar' ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}">
                                <i class="fa-solid fa-calendar-days w-5"></i>
                                <span>カレンダー</span>
                            </button>
                            <button onclick="switchTab('focus')" id="nav-focus" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition ${currentTab === 'focus' ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}">
                                <i class="fa-solid fa-clock w-5"></i>
                                <span>FOCUS (勉強記録)</span>
                            </button>
                            <button onclick="switchTab('board')" id="nav-board" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition ${currentTab === 'board' ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}">
                                <i class="fa-solid fa-comments w-5"></i>
                                <span>家族掲示板</span>
                            </button>
                            <button onclick="switchTab('chat')" id="nav-chat" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition ${currentTab === 'chat' ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}">
                                <i class="fa-solid fa-paper-plane w-5"></i>
                                <span>ダイレクトチャット</span>
                            </button>
                        </nav>
                    </div>

                    <div class="p-4 border-t border-slate-800 space-y-2">
                        <button onclick="switchTab('mypage')" class="w-full flex items-center space-x-3 px-4 py-2 rounded-xl text-sm font-medium hover:bg-slate-800 text-slate-400 hover:text-white transition">
                            <i class="fa-solid fa-gear w-5"></i>
                            <span>マイページ設定</span>
                        </button>
                        <button onclick="logout()" class="w-full flex items-center space-x-3 px-4 py-2 rounded-xl text-sm font-medium hover:bg-rose-500/10 text-rose-400 transition">
                            <i class="fa-solid fa-right-from-bracket w-5"></i>
                            <span>ログアウト</span>
                        </button>
                    </div>
                </div>

                <!-- Main Content Panel -->
                <div id="content-panel" class="flex-1 bg-slate-100 flex flex-col overflow-y-auto">
                    <!-- Tab content rendered dynamically -->
                </div>
            `;
            renderTabContent();
        }

        function switchTab(tab) {
            currentTab = tab;
            // update nav highlights
            ['dashboard', 'calendar', 'focus', 'board', 'chat', 'mypage'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    if (t === tab) {
                        btn.className = "w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium bg-indigo-600 text-white shadow-md transition";
                    } else {
                        btn.className = "w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 text-slate-400 hover:text-white transition";
                    }
                }
            });
            renderTabContent();
        }

        function logout() {
            currentUser = null;
            currentTab = 'dashboard';
            renderLoginView();
        }

        function renderTabContent() {
            const panel = document.getElementById('content-panel');
            if (currentTab === 'dashboard') {
                panel.innerHTML = `
                    <div class="p-6 space-y-6">
                        <div class="flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800">ダッシュボード</h2>
                                <p class="text-xs text-slate-500 mt-0.5">今日の活動サマリーを確認できます</p>
                            </div>
                            <span class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-full font-medium">ログインID: ${currentUser.id}</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                <div class="flex items-center justify-between text-slate-500 mb-2">
                                    <span class="text-xs font-semibold uppercase">本日の勉強時間</span>
                                    <i class="fa-solid fa-clock text-indigo-600"></i>
                                </div>
                                <div class="text-2xl font-bold text-slate-800">
                                    ${focusRecords.filter(r => r.user === currentUser.name).reduce((acc, cur) => acc + cur.time, 0)} <span class="text-sm font-normal text-slate-500">分</span>
                                </div>
                            </div>
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                <div class="flex items-center justify-between text-slate-500 mb-2">
                                    <span class="text-xs font-semibold uppercase">掲示板投稿数</span>
                                    <i class="fa-solid fa-comments text-emerald-600"></i>
                                </div>
                                <div class="text-2xl font-bold text-slate-800">
                                    ${boardPosts.filter(p => p.user === currentUser.name).length} <span class="text-sm font-normal text-slate-500">件</span>
                                </div>
                            </div>
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                <div class="flex items-center justify-between text-slate-500 mb-2">
                                    <span class="text-xs font-semibold uppercase">家族メンバー</span>
                                    <i class="fa-solid fa-users text-amber-600"></i>
                                </div>
                                <div class="text-2xl font-bold text-slate-800">
                                    ${users.length} <span class="text-sm font-normal text-slate-500">名</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'calendar') {
                panel.innerHTML = `
                    <div class="p-6 space-y-6">
                        <div class="flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800">カレンダー</h2>
                                <p class="text-xs text-slate-500 mt-0.5">家族のスケジュール管理</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs text-slate-500 font-medium">タグ:</span>
                                <div class="flex flex-wrap gap-1">
                                    ${customTags.calendar.map(tag => `<span class="px-2 py-0.5 bg-white border border-slate-200 text-slate-600 rounded text-xs">${tag}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center py-16">
                            <i class="fa-solid fa-calendar-days text-4xl text-slate-300 mb-3"></i>
                            <p class="text-slate-600 font-medium">カレンダービュー（2026年6月）</p>
                            <p class="text-xs text-slate-400 mt-1">マイページ設定からカレンダーのタグ編集が可能です。</p>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'focus') {
                panel.innerHTML = `
                    <div class="p-6 space-y-6">
                        <div class="flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800">FOCUS (勉強記録)</h2>
                                <p class="text-xs text-slate-500 mt-0.5">日々の学習時間を記録・管理</p>
                            </div>
                            <button onclick="openFocusModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow transition">
                                <i class="fa-solid fa-plus mr-1.5"></i>記録を追加
                            </button>
                        </div>

                        <!-- Focus Records Table with Delete Function -->
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase tracking-wider">
                                        <th class="p-4 font-semibold">日付</th>
                                        <th class="p-4 font-semibold">ユーザー</th>
                                        <th class="p-4 font-semibold">教科</th>
                                        <th class="p-4 font-semibold">時間</th>
                                        <th class="p-4 font-semibold text-right">操作</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${focusRecords.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-400">記録はありません</td></tr>` : 
                                      focusRecords.map(r => `
                                        <tr class="hover:bg-slate-50 transition">
                                            <td class="p-4 text-slate-600">${r.date}</td>
                                            <td class="p-4 font-medium text-slate-800">${r.user}</td>
                                            <td class="p-4"><span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg text-xs font-semibold">${r.subject}</span></td>
                                            <td class="p-4 text-slate-800 font-semibold">${r.time} 分</td>
                                            <td class="p-4 text-right">
                                                <button onclick="deleteFocusRecord(${r.id})" class="text-rose-500 hover:text-rose-700 p-1.5 rounded-lg hover:bg-rose-50 transition" title="記録を削除">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            </td>
                                        </tr>
                                      `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Add Focus Modal -->
                    <div id="focus-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
                        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                            <h3 class="text-lg font-bold text-slate-800 mb-4">勉強記録の追加</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">教科</label>
                                    <select id="focus-subject" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                        ${customTags.focus.map(t => `<option value="${t}">${t}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">勉強時間 (分)</label>
                                    <input type="number" id="focus-time" value="30" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                </div>
                            </div>
                            <div class="flex justify-end space-x-2 mt-6">
                                <button onclick="closeFocusModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-medium rounded-xl transition">キャンセル</button>
                                <button onclick="addFocusRecord()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-xl transition">追加</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'board') {
                panel.innerHTML = `
                    <div class="p-6 space-y-6">
                        <div class="flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800">家族掲示板</h2>
                                <p class="text-xs text-slate-500 mt-0.5">家族みんなで情報を共有</p>
                            </div>
                        </div>

                        <!-- Board Input Form -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                            <div class="flex space-x-3">
                                <select id="board-tag" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700">
                                    ${customTags.board.map(t => `<option value="${t}">${t}</option>`).join('')}
                                </select>
                                <input type="text" id="board-text" placeholder="家族へのメッセージを入力..." class="flex-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                <button onclick="addBoardPost()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow transition">投稿</button>
                            </div>
                        </div>

                        <!-- Board Posts List -->
                        <div class="space-y-3">
                            ${boardPosts.map(p => `
                                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-start">
                                    <div class="space-y-1">
                                        <div class="flex items-center space-x-2">
                                            <span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded text-xs font-semibold">${p.tag}</span>
                                            <span class="text-xs font-bold text-slate-800">${p.user}</span>
                                            <span class="text-xs text-slate-400">${p.time}</span>
                                        </div>
                                        <p class="text-sm text-slate-700 mt-2">${p.text}</p>
                                    </div>
                                    ${p.user === currentUser.name ? `<button onclick="deleteBoardPost(${p.id})" class="text-slate-400 hover:text-rose-500 p-1 transition"><i class="fa-solid fa-trash-can text-xs"></i></button>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'chat') {
                const otherUsers = users.filter(u => u.name !== currentUser.name);
                panel.innerHTML = `
                    <div class="flex h-full">
                        <!-- Chat Contacts Sidebar -->
                        <div class="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0">
                            <div class="p-4 border-b border-slate-200">
                                <h3 class="font-bold text-slate-800 text-sm">チャット相手を選択</h3>
                            </div>
                            <div class="flex-1 overflow-y-auto divide-y divide-slate-100">
                                ${otherUsers.map(u => `
                                    <div onclick="selectChatUser('${u.name}')" class="p-4 flex items-center space-x-3 cursor-pointer hover:bg-slate-50 transition ${activeChatUser === u.name ? 'bg-indigo-50/50 border-l-4 border-indigo-600' : ''}">
                                        <div class="w-10 h-10 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center font-bold text-sm">
                                            ${u.name.charAt(0)}
                                        </div>
                                        <div>
                                            <h4 class="text-sm font-bold text-slate-800">${u.name}</h4>
                                            <span class="text-xs text-slate-400">${u.role}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Chat Area -->
                        <div class="flex-1 flex flex-col bg-slate-50">
                            ${!activeChatUser ? `
                                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
                                    <i class="fa-solid fa-comments text-4xl text-slate-300 mb-3"></i>
                                    <h3 class="text-base font-bold text-slate-700">特定のチャット相手が選択されていません</h3>
                                    <p class="text-xs text-slate-400 mt-1">左側のリストからチャット相手を選択してください。</p>
                                </div>
                            ` : `
                                <div class="p-4 bg-white border-b border-slate-200 flex items-center justify-between shadow-sm">
                                    <h3 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-circle text-emerald-500 text-xs mr-2"></i>${activeChatUser} とのチャット</h3>
                                </div>
                                <div id="chat-messages-container" class="flex-1 p-4 overflow-y-auto space-y-3">
                                    ${(chatMessages[activeChatUser] || []).map(m => `
                                        <div class="flex flex-col ${m.sender === currentUser.name ? 'items-end' : 'items-start'}">
                                            <div class="max-w-xs md:max-w-md p-3 rounded-2xl text-sm shadow-sm ${m.sender === currentUser.name ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white text-slate-800 rounded-bl-none border border-slate-200'}">
                                                <p>${m.text}</p>
                                            </div>
                                            <span class="text-[10px] text-slate-400 mt-1 px-1">${m.time}</span>
                                        </div>
                                    `).join('')}
                                </div>

                                <!-- Typing Indicator -->
                                <div id="typing-indicator" class="px-4 py-1 text-xs text-slate-400 italic hidden">
                                    入力中...
                                </div>

                                <!-- Chat Input & Stamp Bar -->
                                <div class="p-4 bg-white border-t border-slate-200 space-y-2">
                                    <div class="flex space-x-2 overflow-x-auto pb-1">
                                        <button onclick="sendStamp('👍 おつかれ！')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs text-slate-700 shrink-0 transition">👍 おつかれ！</button>
                                        <button onclick="sendStamp('👏 すごい！')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs text-slate-700 shrink-0 transition">👏 すごい！</button>
                                        <button onclick="sendStamp('🔥 がんばろう！')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs text-slate-700 shrink-0 transition">🔥 がんばろう！</button>
                                        <button onclick="sendStamp('☕ 休憩しよう')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs text-slate-700 shrink-0 transition">☕ 休憩しよう</button>
                                    </div>
                                    <div class="flex space-x-2">
                                        <input type="text" id="chat-input" oninput="handleChatInputTyping()" placeholder="メッセージを入力..." class="flex-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                        <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow transition">送信</button>
                                    </div>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'mypage') {
                panel.innerHTML = `
                    <div class="p-6 space-y-6">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800">マイページ設定</h2>
                            <p class="text-xs text-slate-500 mt-0.5">タグ編集およびアカウント設定</p>
                        </div>

                        <!-- Tag Management Sections -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                <h3 class="font-bold text-slate-800 text-sm">カレンダータグ編集</h3>
                                <div id="calendar-tags-list" class="flex flex-wrap gap-1.5">
                                    ${customTags.calendar.map((t, idx) => `
                                        <span class="inline-flex items-center px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-medium">
                                            ${t}
                                            <button onclick="removeTag('calendar', ${idx})" class="ml-1.5 text-slate-400 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
                                        </span>
                                    `).join('')}
                                </div>
                                <div class="flex space-x-2 pt-2">
                                    <input type="text" id="new-calendar-tag" placeholder="新しいタグ" class="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                                    <button onclick="addTag('calendar')" class="px-3 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">追加</button>
                                </div>
                            </div>

                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                <h3 class="font-bold text-slate-800 text-sm">FOCUS教科タグ編集</h3>
                                <div id="focus-tags-list" class="flex flex-wrap gap-1.5">
                                    ${customTags.focus.map((t, idx) => `
                                        <span class="inline-flex items-center px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-medium">
                                            ${t}
                                            <button onclick="removeTag('focus', ${idx})" class="ml-1.5 text-slate-400 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
                                        </span>
                                    `).join('')}
                                </div>
                                <div class="flex space-x-2 pt-2">
                                    <input type="text" id="new-focus-tag" placeholder="新しい教科" class="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                                    <button onclick="addTag('focus')" class="px-3 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">追加</button>
                                </div>
                            </div>

                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                <h3 class="font-bold text-slate-800 text-sm">掲示板タグ編集</h3>
                                <div id="board-tags-list" class="flex flex-wrap gap-1.5">
                                    ${customTags.board.map((t, idx) => `
                                        <span class="inline-flex items-center px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-medium">
                                            ${t}
                                            <button onclick="removeTag('board', ${idx})" class="ml-1.5 text-slate-400 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
                                        </span>
                                    `).join('')}
                                </div>
                                <div class="flex space-x-2 pt-2">
                                    <input type="text" id="new-board-tag" placeholder="新しいタグ" class="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                                    <button onclick="addTag('board')" class="px-3 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">追加</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function openFocusModal() { document.getElementById('focus-modal').classList.remove('hidden'); }
        function closeFocusModal() { document.getElementById('focus-modal').classList.add('hidden'); }

        function addFocusRecord() {
            const subject = document.getElementById('focus-subject').value;
            const time = parseInt(document.getElementById('focus-time').value) || 0;
            const today = new Date().toISOString().split('T')[0];

            focusRecords.push({ id: Date.now(), user: currentUser.name, subject, time, date: today });
            saveData();
            closeFocusModal();
            renderTabContent();
        }

        function deleteFocusRecord(id) {
            focusRecords = focusRecords.filter(r => r.id !== id);
            saveData();
            renderTabContent();
        }

        function addBoardPost() {
            const tag = document.getElementById('board-tag').value;
            const text = document.getElementById('board-text').value.trim();
            if (!text) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            boardPosts.unshift({ id: Date.now(), user: currentUser.name, tag, text, time: timeStr });
            saveData();
            renderTabContent();
        }

        function deleteBoardPost(id) {
            boardPosts = boardPosts.filter(p => p.id !== id);
            saveData();
            renderTabContent();
        }

        function selectChatUser(name) {
            activeChatUser = name;
            renderTabContent();
            const container = document.getElementById('chat-messages-container');
            if (container) container.scrollTop = container.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !activeChatUser) return;

            if (!chatMessages[activeChatUser]) chatMessages[activeChatUser] = [];
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            chatMessages[activeChatUser].push({ sender: currentUser.name, text, time: timeStr, type: 'text' });
            saveData();
            input.value = '';
            renderTabContent();
            selectChatUser(activeChatUser);
        }

        function sendStamp(stampText) {
            if (!activeChatUser) return;
            if (!chatMessages[activeChatUser]) chatMessages[activeChatUser] = [];
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            chatMessages[activeChatUser].push({ sender: currentUser.name, text: stampText, time: timeStr, type: 'stamp' });
            saveData();
            renderTabContent();
            selectChatUser(activeChatUser);
        }

        function handleChatInputTyping() {
            const indicator = document.getElementById('typing-indicator');
            if (!indicator) return;
            indicator.classList.remove('hidden');
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                indicator.classList.add('hidden');
            }, 1000);
        }

        function addTag(category) {
            const input = document.getElementById(`new-${category}-tag`);
            const val = input.value.trim();
            if (!val) return;
            customTags[category].push(val);
            saveData();
            renderTabContent();
        }

        function removeTag(category, index) {
            customTags[category].splice(index, 1);
            saveData();
            renderTabContent();
        }

        // Initial Load Check
        window.onload = function() {
            renderLoginView();
        };
    </script>
</body>
</html>
