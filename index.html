<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAMILY APP</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
  /* マイページ・プロフィール表示 */
    .profile-card {
      background: #ffffff;
      border: 1px solid #e5e1d8;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .avatar-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #8c857b;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 600;
      margin: 0 auto 12px;
      overflow: hidden;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-size: 15px;
      font-weight: 600;
      color: #383634;
      margin-bottom: 4px;
    }

    .profile-bio {
      font-size: 12px;
      color: #7c766e;
      line-height: 1.4;
      margin-bottom: 16px;
      min-height: 18px;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #fcfbf9;
      width: 90%;
      max-width: 360px;
      border-radius: 8px;
      padding: 24px;
      border: 1px solid #dcd8d0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .modal-title {
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #383634;
    }

    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 10px;
      letter-spacing: 1px;
      color: #8c857b;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .msg-sender {
      font-size: 10px;
      color: #8c857b;
      margin-bottom: 2px;
      font-weight: 600;
    }
    </style>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="loginArea" class="login-box">
    <h2>AUTHENTICATION</h2>
    <input type="text" id="myId" placeholder="USER ID">
    <input type="password" id="myPass" placeholder="PASSWORD">
    <button onclick="login()">LOG IN</button>
    <button onclick="login()" class="sec">GUEST ENTER</button>
  </div>

  <!-- メイン画面 -->
  <div id="mainArea" class="app-container hidden">

    <div id="tab1" class="tab-content active">
      <div class="title">CALENDAR</div>
      <p style="font-size:12px; color:#666;">No events scheduled.</p>
    </div>

    <div id="tab2" class="tab-content">
      <div class="title">TALK</div>
      <div id="chatLog" class="chat-box"></div>
      <div style="display:flex; gap:6px;">
        <input type="text" id="chatInput" placeholder="Message..." style="margin:0;">
        <button onclick="sendMsg()" style="width:70px;">SEND</button>
      </div>
    </div>


     <!-- マイページ（SETTING） -->
    <div id="tab3" class="tab-content">
      <div class="title">MY PAGE</div>
      
      <div class="profile-card">
        <div id="dispAvatar" class="avatar-circle">U</div>
        <div id="dispName" class="profile-name">User</div>
        <div id="dispBio" class="profile-bio">ひとことを設定していません</div>
        <button onclick="openEditModal()" class="sec" style="margin-top: 0;">ACCOUNT EDIT</button>
      </div>

      <button onclick="location.reload()" class="sec" style="color:#a84c4c; border-color:#e2c5c5;">LOG OUT</button>
    </div>
    <div id="tab4" class="tab-content">
      <div class="title">BOARD</div>
      <p style="font-size:12px; color:#666;">No board posts.</p>
    </div>

    <div id="tab5" class="tab-content">
      <div class="title">EXTRA</div>
      <p style="font-size:12px; color:#666;">No extra items.</p>
    </div>

    <!-- 下部ナビゲーション -->
    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="setTab(1)">CALENDAR</button>
      <button class="nav-btn" onclick="setTab(2)">TALK</button>
      <button class="nav-btn" onclick="setTab(3)">MY PAGE</button>
      <button class="nav-btn" onclick="setTab(4)">BOARD</button>
      <button class="nav-btn" onclick="setTab(5)">EXTRA</button>
    </nav>
  </div>

  <script>
    // ユーザー情報の初期状態
    let userProfile = {
      name: "User",
      bio: "ひとことを設定していません",
      avatar: ""
    };

    // 起動時に保存されたプロフィールを読み込む
    window.onload = function() {
      const saved = localStorage.getItem("familyApp_profile");
      if (saved) {
        userProfile = JSON.parse(saved);
      }
      updateProfileUI();
    };

    function login() {
      document.getElementById("loginArea").classList.add("hidden");
      document.getElementById("mainArea").classList.remove("hidden");
    }

    function setTab(num) {
      const tabs = document.querySelectorAll(".tab-content");
      const btns = document.querySelectorAll(".nav-btn");
      
      tabs.forEach((t, i) => {
        if (i === num - 1) {
          t.classList.add("active");
        } else {
          t.classList.remove("active");
        }
      });

      btns.forEach((b, i) => {
        if (i === num - 1) {
          b.classList.add("active");
        } else {
          b.classList.remove("active");
        }
      });
    }

    // プロフィール表示を更新
    function updateProfileUI() {
      document.getElementById("dispName").innerText = userProfile.name || "User";
      document.getElementById("dispBio").innerText = userProfile.bio || "ひとことを設定していません";
      
      const avatarEl = document.getElementById("dispAvatar");
      if (userProfile.avatar) {
        avatarEl.innerHTML = `<img src="${userProfile.avatar}" alt="Avatar">`;
      } else {
        const initial = (userProfile.name || "U").charAt(0).toUpperCase();
        avatarEl.innerText = initial;
      }
    }

    // モーダルを開く
    function openEditModal() {
      document.getElementById("editName").value = userProfile.name || "";
      document.getElementById("editBio").value = userProfile.bio || "";
      document.getElementById("editAvatar").value = userProfile.avatar || "";
      document.getElementById("editModal").classList.remove("hidden");
    }

    // モーダルを閉じる
    function closeEditModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    // プロフィール保存
    function saveProfile() {
      const name = document.getElementById("editName").value.trim();
      const bio = document.getElementById("editBio").value.trim();
      const avatar = document.getElementById("editAvatar").value.trim();

      userProfile.name = name || "User";
      userProfile.bio = bio || "ひとことを設定していません";
      userProfile.avatar = avatar;

      localStorage.setItem("familyApp_profile", JSON.stringify(userProfile));
      updateProfileUI();
      closeEditModal();
    }

    // メッセージ送信（名前付き）
    function sendMsg() {
      const input = document.getElementById("chatInput");
      const log = document.getElementById("chatLog");
      if (!input.value.trim()) return;
      
      const item = document.createElement("div");
      item.style.marginBottom = "10px";

      const sender = document.createElement("div");
      sender.className = "msg-sender";
      sender.innerText = userProfile.name;

      const body = document.createElement("div");
      body.className = "msg";
      body.innerText = input.value;

      item.appendChild(sender);
      item.appendChild(body);
      log.appendChild(item);
      
      input.value = "";
      log.scrollTop = log.scrollHeight;
    }
  </script>
 <!-- アカウント編集モーダル -->
  <div id="editModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-title">EDIT PROFILE</div>
      
      <div class="form-group">
        <label>NICKNAME</label>
        <input type="text" id="editName" placeholder="表示名">
      </div>

      <div class="form-group">
        <label>STATUS MESSAGE</label>
        <input type="text" id="editBio" placeholder="一言メッセージ">
      </div>

      <div class="form-group">
        <label>ICON IMAGE URL (OPTIONAL)</label>
        <input type="text" id="editAvatar" placeholder="https://example.com/icon.jpg">
      </div>

      <div style="display:flex; gap:8px; margin-top:16px;">
        <button onclick="saveProfile()" style="flex:1;">SAVE</button>
        <button onclick="closeEditModal()" class="sec" style="flex:1; margin-top:0;">CANCEL</button>
      </div>
    </div>
  </div>  
</body>
</html>
