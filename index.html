<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Family & Study App</title>
  <style>
    :root {
      --bg-color: #f7f6f3;
      --surface-color: #ffffff;
      --border-color: #e2ded5;
      --border-dark: #d0cbc0;
      --text-main: #383634;
      --text-muted: #7c766e;
      --accent: #5a554e;
      --bubble-me: #eae5dc;
      --bubble-other: #ffffff;
      --dot-unread: #d9534f;
      --dot-online: #5cb85c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: var(--surface-color);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      position: relative;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-color);
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      background: var(--bg-color);
    }

    .content.active {
      display: flex;
    }

    /* ボトムナビゲーション */
    .nav-bar {
      height: 64px;
      border-top: 1px solid var(--border-color);
      display: flex;
      background: var(--surface-color);
      z-index: 10;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: color 0.15s;
      text-transform: uppercase;
    }

    .nav-btn.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* ================= TALK MODULE ================= */
    .talk-header {
      background: var(--surface-color);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      background: var(--bg-color);
      color: var(--text-main);
      margin-bottom: 10px;
      outline: none;
    }

    .talk-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .talk-tab {
      padding: 5px 10px;
      font-size: 11px;
      border: 1px solid var(--border-dark);
      background: var(--surface-color);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .talk-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .friend-item {
      background: var(--surface-color);
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .friend-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      position: relative;
      width: 36px;
      height: 36px;
      background: var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }
    .msg-wrapper.me { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.other { align-self: flex-start; align-items: flex-start; }

    .msg-sender {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 3px;
      font-weight: 600;
    }

    .msg-bubble {
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.6;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      word-break: break-all;
    }
    .me .msg-bubble { background: var(--bubble-me); border-color: var(--border-dark); }
    .other .msg-bubble { background: var(--bubble-other); }

    .chat-input-area {
      padding: 12px 16px;
      background: var(--surface-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      background: var(--bg-color);
      outline: none;
    }

    .chat-send-btn {
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    /* ================= CALENDAR MODULE ================= */
    .cal-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-color);
      border-bottom: 1px solid var(--border-color);
    }

    .icon-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }

    .cal-day-name {
      background: var(--surface-color);
      text-align: center;
      font-size: 11px;
      padding: 8px 0;
      color: var(--text-muted);
      font-weight: 600;
    }

    .cal-cell {
      background: var(--surface-color);
      min-height: 75px;
      padding: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cal-date-num { font-size: 12px; font-weight: 600; }
    .cal-event-dot {
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 3px;
      background: var(--bubble-me);
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .day-detail-panel {
      padding: 16px;
      background: var(--surface-color);
      flex: 1;
      border-top: 1px solid var(--border-color);
      overflow-y: auto;
    }

    /* ================= FOCUS MODULE ================= */
    .focus-container {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .focus-mode-switcher {
      display: flex;
      gap: 8px;
      background: var(--surface-color);
      padding: 4px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .mode-btn {
      padding: 6px 14px;
      font-size: 12px;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 4px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .timer-display {
      font-size: 52px;
      font-weight: 300;
      letter-spacing: 2px;
      margin: 5px 0;
    }

    .timer-settings-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 280px;
      background: var(--surface-color);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .preset-buttons {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .preset-btn {
      padding: 4px 8px;
      font-size: 11px;
      background: var(--bg-color);
      border: 1px solid var(--border-dark);
      border-radius: 4px;
      cursor: pointer;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }

    .timer-btn {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-dark);
    }

    .btn-start { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-reset { background: var(--surface-color); color: var(--text-main); }

    /* ================= BOARD MODULE ================= */
    .board-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .board-card {
      background: var(--surface-color);
      padding: 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ================= MY PAGE MODULE ================= */
    .mypage-container {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .profile-card {
      background: var(--surface-color);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }

    .menu-item {
      padding: 14px 16px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .menu-item:hover { background: #faf9f6; }

    /* サブ画面 / モーダル */
    .sub-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--surface-color);
      display: none;
      flex-direction: column;
      z-index: 50;
    }
    .sub-screen.active {
      display: flex;
    }

    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }

    .modal-content {
      background: var(--surface-color);
      width: 100%;
      max-width: 320px;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- 1. CALENDAR MODULE -->
    <div id="tab-calendar" class="content">
      <div class="cal-header">
        <div class="cal-title" id="cal-month-title" style="font-weight:600; font-size:14px;">2026年 10月</div>
        <button class="icon-btn" onclick="openEventModal()">＋</button>
      </div>
      <div class="cal-grid" id="cal-grid">
        <div class="cal-day-name">日</div><div class="cal-day-name">月</div><div class="cal-day-name">火</div>
        <div class="cal-day-name">水</div><div class="cal-day-name">木</div><div class="cal-day-name">金</div><div class="cal-day-name">土</div>
      </div>
      <div class="day-detail-panel" id="day-detail-panel">
        <h3 id="selected-date-title" style="font-size: 14px; margin-bottom: 8px; font-weight: 600;">日付を選択してください</h3>
        <div id="selected-date-events" style="font-size: 13px; color: var(--text-muted);">予定はありません</div>
      </div>
    </div>

    <!-- 2. TALK MODULE -->
    <div id="tab-talk" class="content active">
      <div class="talk-header">
        <input type="text" id="global-search" class="search-box" placeholder="メッセージや友達を検索..." oninput="filterTalkContent()">
        <div class="talk-tabs">
          <button class="talk-tab active" onclick="switchTalkSubTab('all', this)">全体</button>
          <button class="talk-tab" onclick="switchTalkSubTab('unapproved', this)">未承認</button>
          <button class="talk-tab" onclick="switchTalkSubTab('friends', this)">友達</button>
          <button class="talk-tab" onclick="switchTalkSubTab('groups', this)">グループ</button>
          <button class="talk-tab" onclick="switchTalkSubTab('add', this)">＋ 友達追加</button>
        </div>
      </div>
      
      <div id="talk-body-area" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area" id="chat-input-area">
          <input type="text" id="chat-input" class="chat-input" placeholder="メッセージを入力..." onkeypress="handleKey(event)">
          <button class="chat-send-btn" onclick="sendMessage()">送信</button>
        </div>
      </div>
    </div>

    <!-- 3. MY PAGE MODULE -->
    <div id="tab-mypage" class="content">
      <div class="header">
        <h1>MY PAGE</h1>
        <button class="icon-btn" style="width:28px; height:28px; font-size:14px;" onclick="openSettingsModal()">⚙️</button>
      </div>
      <div class="mypage-container">
        <!-- プロフィール概要カード（閲覧用） -->
        <div class="profile-card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size: 15px; font-weight: 600;" id="display-name">ゲストユーザー</div>
            <button class="timer-btn btn-start" style="padding: 6px 12px; font-size: 11px; flex:none;" onclick="openAccountEditScreen()">アカウント編集</button>
          </div>
          <div style="font-size: 12px; color: var(--text-muted); margin-top:4px;">ID: <span id="display-myid">not set</span></div>
        </div>

        <div class="menu-list">
          <div class="menu-item" onclick="openGameModal('fortune')"><span>今日の運勢を占う</span><span>›</span></div>
          <div class="menu-item" onclick="openGameModal('brain')"><span>脳トレ・ミニパズル</span><span>›</span></div>
        </div>
      </div>
    </div>

    <!-- アカウント編集画面（別画面として表示） -->
    <div id="sub-screen-account" class="sub-screen">
      <div class="header">
        <h1>アカウント編集</h1>
        <button class="icon-btn" style="width:28px; height:28px; font-size:14px;" onclick="closeAccountEditScreen()">✕</button>
      </div>
      <div style="padding: 24px; display: flex; flex-direction: column; gap: 14px; overflow-y:auto; flex:1;">
        <div style="font-size: 12px; color: var(--text-muted);">マイID</div>
        <input type="text" id="edit-myid" class="search-box" style="margin:0;">

        <div style="font-size: 12px; color: var(--text-muted);">ニックネーム</div>
        <input type="text" id="edit-name" class="search-box" style="margin:0;">

        <div style="font-size: 12px; color: var(--text-muted);">パスワード / 合言葉 (PW)</div>
        <input type="password" id="edit-passphrase" class="search-box" style="margin:0;">

        <button class="timer-btn btn-start" style="margin-top: 10px;" onclick="saveAccountSettings()">保存する</button>
      </div>
    </div>

    <!-- 4. BOARD MODULE -->
    <div id="tab-board" class="content">
      <div class="header"><h1>BOARD</h1></div>
      <div class="board-container">
        <div class="board-card">
          <div style="font-weight:600; margin-bottom:4px;">📌 家族のルールメモ</div>
          <div style="color:var(--text-muted); font-size:13px;">ゴミ出しの曜日や大切なお知らせをいつでも残せます。</div>
        </div>
      </div>
    </div>

    <!-- 5. FOCUS MODULE -->
    <div id="tab-focus" class="content">
      <div class="header"><h1>FOCUS</h1></div>
      <div class="focus-container">
        <div class="focus-mode-switcher">
          <button class="mode-btn active" id="mode-timer-btn" onclick="switchFocusMode('timer')">タイマー</button>
          <button class="mode-btn" id="mode-stopwatch-btn" onclick="switchFocusMode('stopwatch')">ストップウォッチ</button>
        </div>

        <div class="timer-display" id="timer-display">25:00</div>

        <div class="timer-settings-box" id="timer-settings-box">
          <div style="font-size: 12px; color: var(--text-muted);">時間設定（分）</div>
          <div style="display: flex; gap: 8px; align-items: center; justify-content: center;">
            <input type="number" id="custom-minutes" value="25" min="1" max="180" class="chat-input" style="width: 80px; text-align: center;" onchange="updateTimerSettings()">
            <span style="font-size: 13px;">分</span>
          </div>
          <div class="preset-buttons">
            <button class="preset-btn" onclick="setPresetMinutes(10)">10分</button>
            <button class="preset-btn" onclick="setPresetMinutes(15)">15分</button>
            <button class="preset-btn" onclick="setPresetMinutes(25)">25分</button>
            <button class="preset-btn" onclick="setPresetMinutes(50)">50分</button>
          </div>
        </div>

        <div class="timer-controls">
          <button class="timer-btn btn-start" id="timer-toggle-btn" onclick="toggleFocusAction()">スタート</button>
          <button class="timer-btn btn-reset" onclick="resetFocusAction()">リセット</button>
        </div>
      </div>
    </div>

    <!-- ボトムナビゲーション（左から: Calendar, Talk, My Page, Board, Focus） -->
    <nav class="nav-bar">
      <button class="nav-btn" onclick="switchTab('calendar', this)">Calendar</button>
      <button class="nav-btn active" onclick="switchTab('talk', this)">Talk</button>
      <button class="nav-btn" onclick="switchTab('mypage', this)">My Page</button>
      <button class="nav-btn" onclick="switchTab('board', this)">Board</button>
      <button class="nav-btn" onclick="switchTab('focus', this)">Focus</button>
    </nav>
  </div>

  <!-- ミニゲームモーダル -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <h3 id="game-title" style="font-size: 15px;">ミニゲーム</h3>
      <div id="game-body" style="font-size: 14px; color: var(--text-muted);">内容</div>
      <button class="timer-btn btn-start" onclick="closeGameModal()">閉じる</button>
    </div>
  </div>

  <script>
    let currentTalkSubTab = 'all';
    
    let messages = JSON.parse(localStorage.getItem('family_messages')) || [];
    let friends = JSON.parse(localStorage.getItem('family_friends')) || [];
    let pendingRequests = JSON.parse(localStorage.getItem('family_pending')) || [];

    let mySettings = JSON.parse(localStorage.getItem('family_my_settings')) || {
      name: 'ゲストユーザー',
      myId: 'user_' + Math.floor(Math.random() * 1000),
      passphrase: 'password123'
    };

    let events = JSON.parse(localStorage.getItem('family_events')) || [];

    // FOCUS 関連の状態変数
    let focusMode = 'timer';
    let focusInterval = null;
    let isFocusRunning = false;
    let timerTotalSeconds = 25 * 60;
    let timerLeftSeconds = 25 * 60;
    let stopwatchSeconds = 0;

    // 初期マイページ表示の反映
    updateMyPageUI();

    function updateMyPageUI() {
      document.getElementById('display-name').innerText = mySettings.name;
      document.getElementById('display-myid').innerText = mySettings.myId;
    }

    function openAccountEditScreen() {
      document.getElementById('edit-myid').value = mySettings.myId;
      document.getElementById('edit-name').value = mySettings.name;
      document.getElementById('edit-passphrase').value = mySettings.passphrase;
      document.getElementById('sub-screen-account').classList.add('active');
    }

    function closeAccountEditScreen() {
      document.getElementById('sub-screen-account').classList.remove('active');
    }

    function saveAccountSettings() {
      mySettings.myId = document.getElementById('edit-myid').value;
      mySettings.name = document.getElementById('edit-name').value;
      mySettings.passphrase = document.getElementById('edit-passphrase').value;
      localStorage.setItem('family_my_settings', JSON.stringify(mySettings));
      updateMyPageUI();
      closeAccountEditScreen();
      alert('アカウント情報を更新しました！');
    }

    function openSettingsModal() {
      alert('設定画面：環境設定を行います。');
    }

    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabId).classList.add('active');
      btnElement.classList.add('active');

      if (tabId === 'calendar') renderCalendar();
    }

    function switchTalkSubTab(subTab, element) {
      document.querySelectorAll('.talk-tab').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      currentTalkSubTab = subTab;
      renderTalkContent();
    }

    function renderTalkContent(filterText = '') {
      const area = document.getElementById('talk-body-area');
      
      if (currentTalkSubTab === 'add') {
        area.innerHTML = `
          <div style="padding: 24px; display:flex; flex-direction:column; gap:16px;">
            <div style="font-size:14px; font-weight:600;">友達をID検索して追加</div>
            <input type="text" id="search-id-input" class="search-box" placeholder="相手のIDを入力...">
            <input type="text" id="search-pass-input" class="search-box" placeholder="合言葉 (PW) を入力...">
            <button class="timer-btn btn-start" onclick="sendFriendRequest()">承認リクエストを送る</button>
          </div>
        `;
        return;
      }

      area.innerHTML = `
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area" id="chat-input-area">
          <input type="text" id="chat-input" class="chat-input" placeholder="メッセージを入力..." onkeypress="handleKey(event)">
          <button class="chat-send-btn" onclick="sendMessage()">送信</button>
        </div>
      `;

      if (currentTalkSubTab === 'friends') {
        const msgContainer = document.getElementById('chat-messages');
        document.getElementById('chat-input-area').style.display = 'none';
        msgContainer.innerHTML = '';

        if (friends.length === 0) {
          msgContainer.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; margin-top:40px; text-align:center;">
              <div style="color:var(--text-muted); font-size:13px;">まだ友達がいません</div>
              <button class="timer-btn btn-start" style="width:auto; padding:8px 16px; font-size:12px;" onclick="document.querySelectorAll('.talk-tab')[4].click()">＋ 友達を追加</button>
            </div>
          `;
          return;
        }

        friends.forEach(f => {
          const item = document.createElement('div');
          item.className = 'friend-item';
          item.innerHTML = `
            <div class="friend-info">
              <div class="avatar-wrapper">${f.name.charAt(0)}</div>
              <span style="font-size:14px; font-weight:500;">${f.name}</span>
            </div>
          `;
          msgContainer.appendChild(item);
        });
        return;
      }

      if (currentTalkSubTab === 'unapproved') {
        const msgContainer = document.getElementById('chat-messages');
        document.getElementById('chat-input-area').style.display = 'none';
        msgContainer.innerHTML = '';

        if (pendingRequests.length === 0) {
          msgContainer.innerHTML = '<div style="color:var(--text-muted); font-size:13px; text-align:center; margin-top:20px;">未承認のリクエストはありません</div>';
          return;
        }

        pendingRequests.forEach((req, idx) => {
          const item = document.createElement('div');
          item.className = 'friend-item';
          item.innerHTML = `
            <div style="font-size:14px;">${req.name} さんからのリクエスト</div>
            <button class="timer-btn btn-start" style="padding:6px 12px; font-size:11px;" onclick="approveFriend(${idx})">承認</button>
          `;
          msgContainer.appendChild(item);
        });
        return;
      }

      document.getElementById('chat-input-area').style.display = 'flex';
      renderMessages(filterText);
    }

    function renderMessages(filterText = '') {
      const container = document.getElementById('chat-messages');
      if (!container) return;
      container.innerHTML = '';
      
      if (messages.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted); font-size:13px; text-align:center; margin-top:20px;">メッセージはまだありません</div>';
        return;
      }

      messages.forEach(m => {
        if (filterText && !m.text.includes(filterText)) return;
        const isMe = m.sender === mySettings.name;
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isMe ? 'me' : 'other'}`;
        
        wrapper.innerHTML = `
          <div class="msg-sender">${m.sender}</div>
          <div class="msg-bubble">${m.text}</div>
          <div class="msg-meta" style="font-size:10px; color:var(--text-muted); margin-top:3px;">${m.time}</div>
        `;
        container.appendChild(wrapper);
      });
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      
      messages.push({
        id: Date.now(),
        sender: mySettings.name,
        text: text,
        time: timeStr
      });
      localStorage.setItem('family_messages', JSON.stringify(messages));
      input.value = '';
      renderMessages();
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function filterTalkContent() {
      const query = document.getElementById('global-search').value;
      if (currentTalkSubTab === 'all' || currentTalkSubTab === 'groups') {
        renderMessages(query);
      }
    }

    function sendFriendRequest() {
      const targetId = document.getElementById('search-id-input').value.trim();
      const pass = document.getElementById('search-pass-input').value.trim();
      if (!targetId || !pass) {
        alert('IDと合言葉を入力してください');
        return;
      }
      alert('リクエストを送信しました（相手の承認待ちです）');
      document.getElementById('search-id-input').value = '';
      document.getElementById('search-pass-input').value = '';
    }

    function approveFriend(index) {
      const approved = pendingRequests.splice(index, 1)[0];
      friends.push({ id: approved.id, name: approved.name });
      localStorage.setItem('family_pending', JSON.stringify(pendingRequests));
      localStorage.setItem('family_friends', JSON.stringify(friends));
      renderTalkContent();
      alert(`${approved.name} さんを友達に追加しました！`);
    }

    /* ---------------- FOCUS ---------------- */
    function switchFocusMode(mode) {
      if (isFocusRunning) resetFocusAction();
      focusMode = mode;
      
      document.getElementById('mode-timer-btn').classList.toggle('active', mode === 'timer');
      document.getElementById('mode-stopwatch-btn').classList.toggle('active', mode === 'stopwatch');
      document.getElementById('timer-settings-box').style.display = (mode === 'timer') ? 'flex' : 'none';

      if (mode === 'timer') {
        updateTimerDisplay(timerLeftSeconds);
      } else {
        stopwatchSeconds = 0;
        updateTimerDisplay(0);
      }
    }

    function setPresetMinutes(mins) {
      document.getElementById('custom-minutes').value = mins;
      updateTimerSettings();
    }

    function updateTimerSettings() {
      const mins = parseInt(document.getElementById('custom-minutes').value) || 25;
      timerTotalSeconds = mins * 60;
      timerLeftSeconds = timerTotalSeconds;
      if (!isFocusRunning && focusMode === 'timer') {
        updateTimerDisplay(timerLeftSeconds);
      }
    }

    function updateTimerDisplay(totalSec) {
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      document.getElementById('timer-display').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function toggleFocusAction() {
      const btn = document.getElementById('timer-toggle-btn');
      if (isFocusRunning) {
        clearInterval(focusInterval);
        isFocusRunning = false;
        btn.innerText = 'スタート';
      } else {
        isFocusRunning = true;
        btn.innerText = '一時停止';
        
        focusInterval = setInterval(() => {
          if (focusMode === 'timer') {
            if (timerLeftSeconds > 0) {
              timerLeftSeconds--;
              updateTimerDisplay(timerLeftSeconds);
            } else {
              clearInterval(focusInterval);
              isFocusRunning = false;
              btn.innerText = 'スタート';
              alert('タイマー終了！お疲れ様でした！');
            }
          } else {
            stopwatchSeconds++;
            updateTimerDisplay(stopwatchSeconds);
          }
        }, 1000);
      }
    }

    function resetFocusAction() {
      clearInterval(focusInterval);
      isFocusRunning = false;
      document.getElementById('timer-toggle-btn').innerText = 'スタート';
      
      if (focusMode === 'timer') {
        timerLeftSeconds = timerTotalSeconds;
        updateTimerDisplay(timerLeftSeconds);
      } else {
        stopwatchSeconds = 0;
        updateTimerDisplay(0);
      }
    }

    /* ---------------- CALENDAR ---------------- */
    function renderCalendar() {
      const grid = document.getElementById('cal-grid');
      while (grid.children.length > 7) grid.removeChild(grid.lastChild);

      for (let i = 1; i <= 31; i++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        const dateStr = `2026-10-${String(i).padStart(2, '0')}`;
        
        cell.innerHTML = `<div class="cal-date-num">${i}</div>`;
        events.filter(ev => ev.date === dateStr).forEach(ev => {
          const dot = document.createElement('div');
          dot.className = 'cal-event-dot';
          dot.innerText = ev.title;
          cell.appendChild(dot);
        });

        cell.onclick = () => {
          document.getElementById('selected-date-title').innerText = `${dateStr} の予定`;
          const matched = events.filter(ev => ev.date === dateStr);
          document.getElementById('selected-date-events').innerHTML = matched.length === 0 ? '予定はありません' : matched.map(e => `<div>・${e.title}</div>`).join('');
        };
        grid.appendChild(cell);
      }
    }

    function openEventModal() {
      const title = prompt('予定のタイトルを入力:');
      if (!title) return;
      events.push({ date: '2026-10-15', title: title });
      localStorage.setItem('family_events', JSON.stringify(events));
      renderCalendar();
    }

    /* ---------------- MINI GAME ---------------- */
    function openGameModal(type) {
      document.getElementById('game-modal').style.display = 'flex';
      const title = document.getElementById('game-title');
      const body = document.getElementById('game-body');
      if (type === 'fortune') {
        title.innerText = '今日の運勢';
        body.innerHTML = '<div style="font-size:18px; font-weight:600; margin:10px 0;">大吉 - 心穏やかな一日</div>ラッキーカラー：グレージュ';
      } else {
        title.innerText = '脳トレ';
        body.innerHTML = '今日の暗記数字：[ 4 8 2 ]';
      }
    }

    function closeGameModal() {
      document.getElementById('game-modal').style.display = 'none';
    }

    // 初期描画
    renderTalkContent();
  </script>
</body>
</html>
